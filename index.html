<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PrintLab — A4 Sheet & Ink-Saver Studio</title>
<meta name="description" content="PrintLab turns photos and notes into exact A4 print sheets — save ink, print passport photos, and export PDF or PNG. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141416">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PrintLab">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--bg:#141416;--card:#1E1E22;--bd:#2C2C32;--ac:#D96B43;--tx:#F4F2EE;--mu:#9d9aa2;--h:52px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{height:var(--h);flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--ac);white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:6px;padding:7px 12px;color:var(--mu)}
.tabs button.on{background:#2C2C32;border-color:#3a3a42;color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#26262c;border:1px solid var(--bd);border-radius:6px;padding:8px 12px;box-shadow:0 1px 0 #000}
.btn:hover{border-color:#4a4a54}.btn:active{transform:translateY(1px);box-shadow:none}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#141416;font-weight:600}
.btn.sm{padding:5px 8px}.btn.on{border-color:var(--ac);color:var(--ac)}
#menu{display:none}
#app{flex:1;display:flex;min-height:0}
#side{width:340px;flex:none;overflow-y:auto;padding:12px;border-right:1px solid var(--bd);background:var(--bg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px}
.row{display:block;margin:10px 0}.row>span{display:flex;justify-content:space-between;color:var(--mu);margin-bottom:2px}.row b{color:var(--tx);font-weight:500}
.tg{display:flex;justify-content:space-between;align-items:center;margin:10px 0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ac)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
select,input[type=text],input[type=number],input[type=date]{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:7px;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns{display:flex;gap:8px;flex-wrap:wrap}
.mu{color:var(--mu);margin:6px 0}
.qi{display:flex;align-items:center;gap:6px;padding:4px;border:1px solid var(--bd);border-radius:6px;margin-top:6px;cursor:default}
.qi.act{border-color:var(--ac)}.qi img{width:34px;height:34px;object-fit:cover;border-radius:3px;background:#fff}
.qi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.qi button{background:none;border:0;padding:4px;color:var(--mu)}.qi button:hover{color:var(--ac)}
.bar{height:8px;background:#2C2C32;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#cropw{display:none;margin-top:10px}#crop{display:block;margin:0 auto;border:1px solid var(--bd);touch-action:none;cursor:grab;max-width:100%}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--card)}
.tb .sp{flex:1}.badge{color:var(--mu);font-size:12px;max-width:300px}
#warn{color:var(--ac);font-size:12px}
.stage{flex:1;overflow:auto;padding:12px;background:#0f0f11}
.sw{display:grid;grid-template-columns:22px auto;grid-template-rows:22px auto;width:max-content;margin:0 auto}
.sw canvas{display:block}#rt,#rl{background:var(--card)}
#sheet{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.6)}
.drag .stage{outline:2px dashed var(--ac);outline-offset:-6px}
#bar{display:none;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd)}
#bar .btn{flex:1;padding:11px}
#installBtn{margin-left:auto}
.installBtn[hidden]{display:none}
a.btn{text-decoration:none}
.creator{display:flex;gap:10px;align-items:center}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;background:var(--ac);color:#141416;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.abtabs{display:flex;gap:4px;margin-bottom:12px}
.abtabs button{flex:1;background:none;border:1px solid var(--bd);border-radius:6px;padding:7px 2px;color:var(--mu);font-size:13px}
.abtabs button.on{background:#2C2C32;border-color:#3a3a42;color:var(--tx)}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mu);margin:0 6px 6px 0}
.abstep{border:1px solid var(--bd);border-radius:6px;padding:10px;margin-top:8px;cursor:pointer}
.abstep h4{margin:0;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.abstep p{margin:8px 0 0;color:var(--mu);font-size:13px}
.abchev{display:inline-flex;flex:none}.abstep.open .abchev svg{transform:rotate(90deg)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat div{border:1px solid var(--bd);border-radius:6px;padding:10px}
.feat h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.feat p{margin:0;color:var(--mu);font-size:12px}
.other{border:1px solid var(--ac);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--card)}
.other h3{margin:0 0 8px;font-size:14px}
.proj{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.pcard{display:flex;flex-direction:column;gap:8px;border:1px solid var(--bd);border-radius:8px;padding:12px;background:var(--card)}
.pcard .phead{display:flex;align-items:center;gap:10px}
.picon{width:40px;height:40px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#141416}
.picon svg{width:22px;height:22px}
.pcard h4{margin:0;font-size:14px}
.pcard .ptag{margin:2px 0 0;color:var(--ac);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pcard p.pdesc{margin:0;color:var(--mu);font-size:13px;line-height:1.5;flex:1}
.pcard .btn{align-self:flex-start}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#2C2C32;border:1px solid var(--ac);padding:9px 14px;border-radius:6px;z-index:50;display:none;max-width:90vw}
#printArea{display:none}
@media(max-width:860px){
 #menu{display:inline-flex}.brand span{display:none}.tabs{margin-left:0}.tabs button{padding:7px 9px}.tabs .tl{display:none}
 #side{position:fixed;left:0;top:var(--h);bottom:0;width:min(340px,88vw);z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 16px rgba(0,0,0,.5)}
 #side.open{transform:none}#bar{display:flex}.badge{max-width:none}.desk{display:none}
}
</style>
</head>
<body>

<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>

<symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H5zM8 3v5h8V3M8 21v-7h8v7"/></symbol>

</defs></svg>

<header>
 <button class="btn sm" id="menu" data-act="menu" aria-label="Open tools"><svg class="i"><use href="#i-menu"/></svg></button>
 <div class="brand"><svg class="i"><use href="#i-page"/></svg><span>PrintLab</span></div>
 <nav class="tabs">
  <button data-mode="ink" class="on"><svg class="i"><use href="#i-notes"/></svg><span class="tl">Ink-saver notes</span></button>
  <button data-mode="photo"><svg class="i"><use href="#i-crop"/></svg><span class="tl">Photo sheets</span></button>
  <button data-mode="tpl"><svg class="i"><use href="#i-grid"/></svg><span class="tl">Templates</span></button>
  <button data-mode="about"><svg class="i"><use href="#i-info"/></svg><span class="tl">About</span></button>
 </nav>
 <button class="btn installBtn" id="installBtn" hidden><svg class="i"><use href="#i-pdf"/></svg><span class="desk">Install app</span></button>
</header>

<div id="app">
 <aside id="side" aria-label="Tools"></aside>
 <main id="main">
  <div class="tb">
   <button class="btn sm on" data-act="zoom" data-z="fit">Fit</button>
   <button class="btn sm" data-act="zoom" data-z="0.5">50%</button>
   <button class="btn sm" data-act="zoom" data-z="1">100%</button>
   <button class="btn sm" data-act="prevp" aria-label="Previous sheet"><svg class="i"><use href="#i-left"/></svg></button>
   <span id="pgl">Sheet 1 / 1</span>

   <span class="desk btns">

    <button class="btn pri" data-act="pdf"><svg class="i"><use href="#i-pdf"/></svg>Download PDF</button>
   </span>
  </div>

  </div>

 </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const PAPER={a4:[210,297],'4x6':[102,152],letter:[216,279],legal:[216,356],a5:[148,210]};
const SHEET={a4:[210,297],letter:[216,279],legal:[216,356],a5:[148,210]};
const SIZES={in:[35,45],stamp:[25,30],pan:[25,35],us:[51,51],post:[102,152],eu:[35,45],in2:[51,51]};
/* ---------- my other work ----------

   needs to change. icon = an SVG symbol name (see the <symbol> list,
   e.g. "share" -> #i-share). accent = the icon tile colour. */
const PROJECTS=[
 {name:"SnoahShare",tag:"File sharing",icon:"share",accent:"#D96B43",url:"https://get-connected-snoah.vercel.app",desc:"Share files between any two devices. Upload on one, open the room code on the other, and download. No accounts, no cables, no fuss."},
 {name:"SnoahAI",tag:"AI assistant",icon:"ai",accent:"#E8A33D",url:"https://snoah-ai.vercel.app/",desc:"Your AI assistant in the browser — chat with 20+ AI models, voice conversations, workflows, web search and more."},
];
const projCard=p=>`<article class="pcard"><div class="phead"><div class="picon" style="background:${p.accent}">${ic(p.icon)}</div><div><h4>${p.name}</h4><p class="ptag">${p.tag}</p></div></div><p class="pdesc">${p.desc}</p><a class="btn" href="${p.url}" target="_blank" rel="noopener">Open ${ic('ext')}</a></article>`;
const DEF={mode:'ink',
 ink:{invert:false,hue:false,white:225,mono:'color',eco:false,scan:false,paper:'a4',bri:0,con:0,sharp:0,per:1,orient:'portrait',margin:10,gap:5,border:false},
 photo:{paper:'a4',pw:210,ph:297,size:'in',w:35,h:45,strip:false,name:'',date:new Date().toISOString().slice(0,10),auto:true,count:6,marks:true,border:true,margin:8,gap:3},
 tpl:{kind:'lined',month:new Date().toISOString().slice(0,7),line:7,grid:5,todo:12,tcols:2,trows:4}};
const KEY='printlab.v1';
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'{}');return{mode:['ink','photo','tpl'].includes(j.mode)?j.mode:'ink',ink:{...DEF.ink,...j.ink},photo:{...DEF.photo,...j.photo},tpl:{...DEF.tpl,...j.tpl}}}catch(e){return JSON.parse(JSON.stringify(DEF))}}
let S=load(),INK=[],PH=[],uid=0,active=0,pg=0,zoom='fit',tm,rt,view='tool';

/* ---------- toast / busy ---------- */

const tick=()=>new Promise(r=>setTimeout(r,25));

/* ---------- sidebar ---------- */

const tg=(g,k,l)=>`<label class="tg"><span>${l}</span><input type="checkbox" data-g="${g}" data-k="${k}"></label>`;

const num=(g,k,l,min=1,max=2000,st=.5)=>`<label class="row"><span>${l}</span><input type="number" data-g="${g}" data-k="${k}" min="${min}" max="${max}" step="${st}" inputmode="decimal"></label>`;
function build(){

 <div class="card"><h3>Ink coverage</h3><div id="meter"></div></div>

  <div class="btns"><button class="btn pri" data-act="saveproj" data-side="ink">${ic('save')}Save project</button></div>

</section>

   <button class="btn" data-tplkind="flash">Flashcards</button>
   <button class="btn" data-tplkind="labels">Labels</button>
   <button class="btn" data-tplkind="todo">To-do list</button>
   <button class="btn" data-tplkind="cal">Calendar</button>
  </div>
  <div id="tplOpts"></div></div>
 <div class="card"><h3>Sheet layout</h3>
  ${sel('ink','paper','Paper size',[['a4','A4 (210 × 297 mm)'],['letter','Letter (216 × 279 mm)'],['legal','Legal (216 × 356 mm)'],['a5','A5 (148 × 210 mm)']])}
  <p class="mu">Templates use the same paper size as Ink-saver notes.</p></div>
</section>
<section id="pPhoto" hidden>
 <div class="card"><h3>Photos</h3>
  <div class="btns"><button class="btn pri" data-act="add">${ic('plus')}Add photos</button><button class="btn" data-act="paste">${ic('paste')}Paste</button></div>
  <div id="phQ"></div>
  <div id="cropw"><p class="mu">Drag to reposition. Scroll or use the slider to zoom.</p><canvas id="crop"></canvas>
   <label class="row"><span>Zoom<b id="vz"></b></span><input type="range" id="zoomR" min="1" max="4" step="0.01"></label>

/* ---------- state sync ---------- */
function sync(){
 $$('[data-g]').forEach(el=>{const v=S[el.dataset.g][el.dataset.k];if(el.type==='checkbox')el.checked=!!v;else if(document.activeElement!==el)el.value=v;
  const b=$('#v-'+el.dataset.g+'-'+el.dataset.k);if(b)b.textContent=' '+v+b.dataset.u});
 const p=PH[active];if(p){$('#zoomR').value=p.z;$('#briR').value=p.bri;$('#vz').textContent=' '+p.z.toFixed(2)+'×';$('#vb').textContent=' '+p.bri}
 $$('.tabs button').forEach(b=>b.classList.toggle('on',view==='about'?b.dataset.mode==='about':b.dataset.mode===S.mode));
 $('#pInk').hidden=view!=='tool'||S.mode!=='ink';$('#pPhoto').hidden=view!=='tool'||S.mode!=='photo';
 const pt=$('#pTpl');if(pt)pt.hidden=view!=='tool'||S.mode!=='tpl';
 const pa=$('#pAbout');if(pa)pa.hidden=view!=='about';
 $$('[data-act=zoom]').forEach(b=>b.classList.toggle('on',String(b.dataset.z)===String(zoom)));
}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='zoomR'&&PH[active]){PH[active].z=+t.value;clampCrop(PH[active]);sync();render();return}
 if(t.id==='briR'&&PH[active]){PH[active].bri=+t.value;sync();render();return}
 const g=t.dataset.g,k=t.dataset.k;if(!g)return;
 let v=t.type==='checkbox'?t.checked:(t.type==='range'||t.type==='number')?+t.value:t.value;
 if(t.tagName==='SELECT'&&/^\d+$/.test(v))v=+v;
 if(t.type==='number'&&!(v>=1))return;
 S[g][k]=v;const P=S.photo;
 if(g==='photo'){
  if(k==='paper'&&PAPER[v]){P.pw=PAPER[v][0];P.ph=PAPER[v][1]}
  if(k==='size'&&SIZES[v]){P.w=SIZES[v][0];P.h=SIZES[v][1]}
  if(k==='pw'||k==='ph')P.paper='custom';
  if(k==='w'||k==='h')P.size='custom';
  PH.forEach(clampCrop);
 }
 sync();render();
});

/* ---------- file intake ---------- */
function decode(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{URL.revokeObjectURL(u);if(!im.naturalWidth)return rej();const k=Math.min(1,3000/Math.max(im.naturalWidth,im.naturalHeight)),c=mk(Math.round(im.naturalWidth*k),Math.round(im.naturalHeight*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c)};
 im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function thumb(c){const k=68/Math.max(c.width,c.height),t=mk(Math.max(1,Math.round(c.width*k)),Math.max(1,Math.round(c.height*k)));t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.7)}
async function addFiles(files){
 if(S.mode==='tpl'){toast('Templates don’t use photos — switch to Ink-saver or Photo sheets to add images.');return}
 const all=[...files],list=all.filter(f=>/^image\/(png|jpe?g|webp)$/.test(f.type));
 if(!list.length){toast('Unsupported file. Use PNG, JPG or WebP images.');return}
 if(list.length<all.length)toast('Some files were skipped. Only PNG, JPG and WebP are supported.');
 let ok=0;
 for(const f of list){try{const src=await decode(f),it={id:++uid,src,name:f.name||'pasted-image.png',thumb:thumb(src)};
  if(S.mode==='ink')INK.push(it);else{PH.push({...it,z:1,cx:.5,cy:.5,bri:0});active=PH.length-1}ok++}
  catch(e){toast('Could not read '+(f.name||'an image')+'. The file may be damaged.')}}
 if(ok){pg=0;ui()}
}
$('#file').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);if(fs.length){e.preventDefault();addFiles(fs)}});
async function pasteBtn(){try{const items=await navigator.clipboard.read(),fs=[];for(const it of items)for(const t of it.types)if(t.startsWith('image/'))fs.push(new File([await it.getType(t)],'pasted-image.png',{type:t}));
 fs.length?addFiles(fs):toast('No image found on the clipboard.')}catch(e){toast('Clipboard access was blocked. Press Ctrl+V (or long-press and paste) instead.')}}

/* ---------- ink filter engine ---------- */
function inkFx(c,o){
 if(o.scan){
  /* Scan document: grayscale, stretch the levels so the paper is white
     and the print is black, then threshold to pure black & white.
     Runs on its own — the other filter sliders are ignored in this mode. */
  const x=c.getContext('2d'),w=c.width,h=c.height,im=x.getImageData(0,0,w,h),d=im.data,n=d.length;
  const lum=new Float32Array(n/4);
  let lo=255,hi=0;
  for(let i=0,j=0;i<n;i+=4,j++){const v=.299*d[i]+.587*d[i+1]+.114*d[i+2];lum[j]=v;if(v<lo)lo=v;if(v>hi)hi=v}
  const span=Math.max(1,hi-lo);
  for(let i=0,j=0;i<n;i+=4,j++){const v=(lum[j]-lo)/span*255;d[i]=d[i+1]=d[i+2]=v>=140?255:0;d[i+3]=255}
  x.putImageData(im,0,0);return;
 }
 const x=c.getContext('2d'),w=c.width,h=c.height,im=x.getImageData(0,0,w,h),d=im.data,n=d.length;
 const cf=o.con*2.55,f=259*(cf+255)/(255*(259-cf)),b=o.bri*2.55,wp=255/o.white,mono=o.mono!=='color';
 for(let i=0;i<n;i+=4){let r=d[i],g=d[i+1],l=d[i+2];
  if(o.invert){if(o.hue){const k=255-2*(.299*r+.587*g+.114*l);r+=k;g+=k;l+=k}else{r=255-r;g=255-g;l=255-l}}
  if(mono){r=g=l=.299*r+.587*g+.114*l}
  d[i]=(r-128)*f+128+b;d[i+1]=(g-128)*f+128+b;d[i+2]=(l-128)*f+128+b}
 if(o.sharp>0){const s=o.sharp/100*1.5,cp=new Uint8ClampedArray(d),w4=w*4;
  for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){const p=(y*w+xx)*4;for(let k=0;k<3;k++){const v=cp[p+k];d[p+k]=v+s*(4*v-cp[p-4+k]-cp[p+4+k]-cp[p-w4+k]-cp[p+w4+k])}}}
 const bw=o.mono==='bw';
 for(let i=0;i<n;i+=4)for(let k=0;k<3;k++){let v=d[i+k]*wp;if(v>255)v=255;if(bw)v=v>=140?255:0;if(o.eco)v=46+v*209/255;d[i+k]=v}
 x.putImageData(im,0,0);
}
function proc(src,w,h,o){const c=mk(w,h),x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,w,h);inkFx(c,o);return c}
function cov(c){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let s=0;for(let i=0;i<d.length;i+=4)s+=255-(d[i]+d[i+1]+d[i+2])/3;return s/(d.length/4*255)}
function meter(){
 const el=$('#meter');if(S.mode!=='ink')return;
 if(!INK.length){el.innerHTML='<p class="mu">Add images to see ink coverage.</p>';return}
 let a=0,b=0,A=0;
 for(const it of INK){const k=Math.min(1,220/Math.max(it.src.width,it.src.height)),w=Math.max(1,Math.round(it.src.width*k)),h=Math.max(1,Math.round(it.src.height*k)),c0=mk(w,h);
  c0.getContext('2d').drawImage(it.src,0,0,w,h);a+=cov(c0)*w*h;b+=cov(proc(it.src,w,h,S.ink))*w*h;A+=w*h}
 a=a/A*100;b=b/A*100;const sv=a>0?Math.max(0,(a-b)/a*100):0;
 el.innerHTML=`<p>Original: <b>${a.toFixed(0)}% ink</b> → Optimised: <b>${b.toFixed(0)}% ink</b> (${sv.toFixed(0)}% saved)</p><div class="bar"><i style="width:${b}%"></i></div>`;
}

/* ---------- sheet geometry ---------- */
function inkGrid(){
 const o=S.ink,L=o.orient==='landscape',ps=SHEET[o.paper]||SHEET.a4,W=L?ps[1]:ps[0],H=L?ps[0]:ps[1],p=+o.per;let cols=1,rows=1;
 if(p===2)[cols,rows]=L?[2,1]:[1,2];else if(p===4)[cols,rows]=[2,2];else if(p===6)[cols,rows]=L?[3,2]:[2,3];
 return{W,H,cols,rows,cw:Math.max(5,(W-2*o.margin-(cols-1)*o.gap)/cols),ch:Math.max(5,(H-2*o.margin-(rows-1)*o.gap)/rows)};
}
const inkPages=()=>Math.max(1,Math.ceil(INK.length/S.ink.per));
function photoGeom(){const o=S.photo;return{W:o.pw,H:o.ph,cols:Math.max(0,Math.floor((o.pw-2*o.margin+o.gap)/(o.w+o.gap))),rows:Math.max(0,Math.floor((o.ph-2*o.margin+o.gap)/(o.h+o.gap)))}}
function tplGeom(){const s=SHEET[S.ink.paper]||SHEET.a4;return{W:s[0],H:s[1],cols:0,rows:0}}
const dims=()=>S.mode==='ink'?inkGrid():S.mode==='tpl'?tplGeom():photoGeom();
const P=(mm,dpi)=>Math.round(mm/25.4*dpi);
function hint(cv,msg){const x=cv.getContext('2d');x.fillStyle='#9a9aa0';x.textAlign='center';x.textBaseline='middle';x.font=`${cv.width/24}px system-ui,sans-serif`;x.fillText(msg,cv.width/2,cv.height/2)}

/* ---------- ink sheet ---------- */
function drawInk(cv,page,dpi){
 const o=S.ink,g=inkGrid(),p=m=>P(m,dpi);cv.width=p(g.W);cv.height=p(g.H);
 const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
 for(let i=0;i<o.per;i++){const it=INK[page*o.per+i];if(!it)break;
  const col=i%g.cols,row=Math.floor(i/g.cols),cx=o.margin+col*(g.cw+o.gap),cy=o.margin+row*(g.ch+o.gap);
  const k=Math.min(g.cw/it.src.width,g.ch/it.src.height),mw=it.src.width*k,mh=it.src.height*k;
  const pw=Math.max(1,Math.min(p(mw),it.src.width)),ph=Math.max(1,Math.round(pw*it.src.height/it.src.width));
  const dx=p(cx+(g.cw-mw)/2),dy=p(cy+(g.ch-mh)/2),dw=p(mw),dh=p(mh);
  x.imageSmoothingQuality='high';x.drawImage(proc(it.src,pw,ph,o),dx,dy,dw,dh);
  if(o.border){x.strokeStyle='#000';x.lineWidth=Math.max(1,dpi*.2/25.4);x.strokeRect(dx+.5,dy+.5,dw-1,dh-1)}}
 if(!INK.length)hint(cv,'Add images to build a sheet');
}

/* ---------- photo tile + sheet ---------- */
function fmtDate(s){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?`${m[3]}-${m[2]}-${m[1]}`:(s||'')}
function cover(p,tw,th){return Math.max(tw/p.src.width,th/p.src.height)*p.z}
function clampCrop(p){const o=S.photo,s=cover(p,o.w,o.h),hx=o.w/s/2/p.src.width,hy=o.h/s/2/p.src.height;
 p.cx=Math.min(1-hx,Math.max(hx,p.cx));p.cy=Math.min(1-hy,Math.max(hy,p.cy))}
function tile(p,dpi){
 const o=S.photo,tw=Math.max(1,P(o.w,dpi)),th=Math.max(1,P(o.h,dpi)),c=mk(tw,th),x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,tw,th);
 const s=cover(p,tw,th),sw=tw/s,sh=th/s,W=p.src.width,H=p.src.height;
 const sx=Math.min(Math.max(p.cx*W-sw/2,0),W-sw),sy=Math.min(Math.max(p.cy*H-sh/2,0),H-sh);
 x.imageSmoothingQuality='high';x.drawImage(p.src,sx,sy,sw,sh,0,0,tw,th);
 if(p.bri){const im=x.getImageData(0,0,tw,th),d=im.data,m=1+p.bri/100;for(let i=0;i<d.length;i+=4){d[i]*=m;d[i+1]*=m;d[i+2]*=m}x.putImageData(im,0,0)}
 if(o.strip){const bh=Math.round(th*.18),y=th-bh,lines=[o.name,fmtDate(o.date)].filter(Boolean);
  x.fillStyle='#fff';x.fillRect(0,y,tw,bh);x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';
  lines.forEach((t,i)=>{let fs=bh/(lines.length+.7);x.font=`600 ${fs}px system-ui,sans-serif`;while(x.measureText(t).width>tw*.94&&fs>4){fs--;x.font=`600 ${fs}px system-ui,sans-serif`}x.fillText(t,tw/2,y+bh*(i+.5)/lines.length)})}
 return c;
}
function drawPhoto(cv,dpi){
 const o=S.photo,g=photoGeom(),p=m=>P(m,dpi);cv.width=p(g.W);cv.height=p(g.H);
 const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
 const cap=g.cols*g.rows;let warn='';
 if(!PH.length){hint(cv,'Add a photo to fill this sheet');return cap}
 if(!cap){hint(cv,'Photo is larger than the printable area');return 0}
 const n=o.auto?cap:Math.min(o.count,cap);if(!o.auto&&o.count>cap)warn=`Only ${cap} fit on this sheet.`;
 $('#warn').textContent=warn;
 const tiles=PH.map(ph=>tile(ph,dpi)),uc=Math.min(n,g.cols),ur=Math.ceil(n/g.cols);
 const bw=uc*o.w+(uc-1)*o.gap,x0=(g.W-bw)/2,y0=o.margin,lw=Math.max(1,dpi*.3/25.4);
 for(let i=0;i<n;i++){const c=i%g.cols,r=Math.floor(i/g.cols),px=p(x0+c*(o.w+o.gap)),py=p(y0+r*(o.h+o.gap));
  x.drawImage(tiles[i%tiles.length],px,py);
  if(o.border){x.strokeStyle='#000';x.lineWidth=lw;x.strokeRect(px+lw/2,py+lw/2,tiles[0].width-lw,tiles[0].height-lw)}}
 if(o.marks){x.strokeStyle='#666';x.lineWidth=Math.max(1,dpi*.15/25.4);x.beginPath();
  const bh=ur*o.h+(ur-1)*o.gap,yb=y0+bh,xr=x0+bw,off=1,len=2.5;
  const line=(a,b,c2,d)=>{x.moveTo(p(a),p(b));x.lineTo(p(c2),p(d))};
  for(let c=0;c<uc;c++)for(const xe of[x0+c*(o.w+o.gap),x0+c*(o.w+o.gap)+o.w]){if(y0-off-len>=0)line(xe,y0-off-len,xe,y0-off);if(yb+off+len<=g.H)line(xe,yb+off,xe,yb+off+len)}
  for(let r=0;r<ur;r++)for(const ye of[y0+r*(o.h+o.gap),y0+r*(o.h+o.gap)+o.h]){if(x0-off-len>=0)line(x0-off-len,ye,x0-off,ye);if(xr+off+len<=g.W)line(xr+off,ye,xr+off+len,ye)}
  x.stroke()}
 return cap;
}
function drawCrop(){
 const p=PH[active],cv=$('#crop');if(!p)return;const o=S.photo,r=o.h/o.w,w=Math.round(Math.min(280,300/r)),dpi=w/(o.w/25.4);
 const t=tile(p,dpi);cv.width=t.width;cv.height=t.height;cv.style.width=w+'px';cv.getContext('2d').drawImage(t,0,0);
}
function initCrop(){const cv=$('#crop');let dr=null;
 cv.addEventListener('pointerdown',e=>{dr={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
 cv.addEventListener('pointerup',()=>{dr=null;cv.style.cursor='grab'});
 cv.addEventListener('pointermove',e=>{const p=PH[active];if(!dr||!p)return;const k=cv.width/cv.clientWidth,s=cover(p,cv.width,cv.height);
  p.cx-=(e.clientX-dr.x)*k/(s*p.src.width);p.cy-=(e.clientY-dr.y)*k/(s*p.src.height);dr={x:e.clientX,y:e.clientY};clampCrop(p);render()});
 cv.addEventListener('wheel',e=>{const p=PH[active];if(!p)return;e.preventDefault();p.z=Math.min(4,Math.max(1,p.z*(e.deltaY<0?1.06:.94)));clampCrop(p);sync();render()},{passive:false});
}

/* ---------- ready-made templates ---------- */
function syncTplOpts(){
 const k=S.tpl.kind,el=$('#tplOpts');if(!el)return;
 if(k==='lined')el.innerHTML=sel('tpl','line','Line spacing',[['7','7 mm — narrow'],['9','9 mm — wide']]);
 else if(k==='grid')el.innerHTML=sel('tpl','grid','Grid size',[['5','5 mm'],['10','10 mm']]);
 else if(k==='flash')el.innerHTML=`<div class="two">${sel('tpl','tcols','Columns',[['2','2'],['3','3']])}${sel('tpl','trows','Rows',[['3','3'],['4','4']])}</div>`;
 else if(k==='labels')el.innerHTML='<p class="mu">2 columns × 5 rows of blank labels with cut guides.</p>';
 else if(k==='todo')el.innerHTML=sel('tpl','todo','Lines',[['6','6'],['12','12'],['18','18']]);
 else if(k==='cal')el.innerHTML=`<label class="row"><span>Month</span><input type="month" data-g="tpl" data-k="month"></label>`;
 $$('#tplKinds .btn').forEach(b=>b.classList.toggle('on',b.dataset.tplkind===k));
 sync();
}
function drawTpl(cv,dpi){
 const g=tplGeom(),p=m=>P(m,dpi),W=g.W,H=g.H;
 cv.width=p(W);cv.height=p(H);
 const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
 const k=S.tpl.kind,mx=12,my=12;
 const line=(a,b,c2,d)=>{x.beginPath();x.moveTo(p(a),p(b));x.lineTo(p(c2),p(d));x.stroke()};
 if(k==='lined'){
  x.strokeStyle='#e2574c';x.lineWidth=Math.max(1,p(.3));line(25,my,25,H-my);
  x.strokeStyle='#a9bce0';x.lineWidth=Math.max(1,p(.25));
  for(let y=my+S.tpl.line;y<=H-my;y+=S.tpl.line)line(mx,y,W-mx,y);
 }else if(k==='grid'){
  x.strokeStyle='#d5dae3';x.lineWidth=Math.max(1,p(.2));
  for(let gx=mx;gx<=W-mx;gx+=S.tpl.grid)line(gx,my,gx,H-my);
  for(let gy=my;gy<=H-my;gy+=S.tpl.grid)line(mx,gy,W-mx,gy);
 }else if(k==='flash'){
  const cols=S.tpl.tcols,rows=S.tpl.trows,gap=4;
  const cw=(W-2*mx-(cols-1)*gap)/cols,ch=(H-2*my-(rows-1)*gap)/rows;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const X=mx+c*(cw+gap),Y=my+r*(ch+gap);
   x.strokeStyle='#555';x.lineWidth=Math.max(1,p(.3));x.strokeRect(p(X),p(Y),p(cw),p(ch));
   x.strokeStyle='#c8c8c8';x.lineWidth=Math.max(1,p(.25));line(X+4,Y+7,X+cw-4,Y+7);
  }
 }else if(k==='labels'){
  const cols=2,rows=5,gap=3;
  const cw=(W-2*mx-(cols-1)*gap)/cols,ch=(H-2*my-(rows-1)*gap)/rows;
  x.strokeStyle='#999';x.lineWidth=Math.max(1,p(.25));x.setLineDash([p(2),p(2)]);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)x.strokeRect(p(mx+c*(cw+gap)),p(my+r*(ch+gap)),p(cw),p(ch));
  x.setLineDash([]);
 }else if(k==='todo'){
  x.textAlign='left';x.textBaseline='alphabetic';
  x.font=`700 ${p(8)}px system-ui,sans-serif`;x.fillStyle='#222';x.fillText('TO-DO',p(mx),p(26));
  x.font=`${p(3.5)}px system-ui,sans-serif`;x.fillStyle='#888';x.fillText('Date: _______________',p(mx),p(33));
  const n=S.tpl.todo,step=10;let y=42;
  x.strokeStyle='#555';x.lineWidth=Math.max(1,p(.3));
  for(let i=0;i<n&&y<=H-my;i++){x.strokeRect(p(mx),p(y),p(5),p(5));line(mx+8,y+2.5,W-mx,y+2.5);y+=step}
 }else if(k==='cal'){
  let ym=S.tpl.month;if(!/^\d{4}-\d{2}$/.test(ym||''))ym=new Date().toISOString().slice(0,7);
  const yy=+ym.slice(0,4),mm=+ym.slice(5,7);
  const first=new Date(yy,mm-1,1),startDow=(first.getDay()+6)%7,days=new Date(yy,mm,0).getDate();
  const weeks=Math.ceil((startDow+days)/7);
  const title=first.toLocaleString('en',{month:'long'})+' '+yy;
  x.textAlign='center';x.font=`700 ${p(8)}px system-ui,sans-serif`;x.fillStyle='#222';
  x.fillText(title,p(W/2),p(24));
  const top=30,cw=(W-2*mx)/7,ch=(H-my-top)/weeks;
  const wd=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  x.font=`600 ${p(3.5)}px system-ui,sans-serif`;x.fillStyle='#555';
  wd.forEach((d,i)=>x.fillText(d,p(mx+(i+.5)*cw),p(top-2)));
  x.strokeStyle='#bbb';x.lineWidth=Math.max(1,p(.25));
  for(let wI=0;wI<weeks;wI++)for(let dI=0;dI<7;dI++){
   const X=mx+dI*cw,Y=top+wI*ch;
   x.strokeRect(p(X),p(Y),p(cw),p(ch));
   const day=wI*7+dI-startDow+1;
   if(day>=1&&day<=days){x.textAlign='left';x.font=`${p(4)}px system-ui,sans-serif`;x.fillStyle='#222';x.fillText(String(day),p(X+2),p(Y+6))}
  }
 }
}

/* ---------- render, rulers, zoom ---------- */
function render(){clearTimeout(rt);rt=setTimeout(doRender,60)}
function doRender(){
 const cv=$('#sheet');$('#warn').textContent='';
 try{if(S.mode==='ink'){pg=Math.max(0,Math.min(pg,inkPages()-1));drawInk(cv,pg,110);meter()}else if(S.mode==='tpl'){pg=0;drawTpl(cv,110)}else{pg=0;drawPhoto(cv,110);drawCrop()}}
 catch(e){toast('Could not draw the preview. Try a smaller image.')}
 $('#pgl').textContent=`Sheet ${pg+1} / ${S.mode==='ink'?inkPages():1}`;
 applyZoom();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
function ruler(cv,len,ppm,vert){
 const d=window.devicePixelRatio||1,L=Math.round(len*ppm),T=22;cv.width=(vert?T:L)*d;cv.height=(vert?L:T)*d;cv.style.width=(vert?T:L)+'px';cv.style.height=(vert?L:T)+'px';
 const x=cv.getContext('2d');x.scale(d,d);x.fillStyle='#1E1E22';x.fillRect(0,0,vert?T:L,vert?L:T);x.strokeStyle='#8d8a92';x.fillStyle='#9d9aa2';x.font='9px system-ui';x.lineWidth=1;x.beginPath();
 for(let m=0;m<=len;m++){if(m%5&&ppm<3)continue;const q=m*ppm+.5,t=m%10===0?12:m%5===0?8:4;
  if(vert){x.moveTo(T,q);x.lineTo(T-t,q);if(m%10===0&&m)x.fillText(m/10,2,q+3)}else{x.moveTo(q,T);x.lineTo(q,T-t);if(m%10===0&&m)x.fillText(m/10,q+2,9)}}
 x.stroke();
}
function applyZoom(){
 const g=dims(),st=$('#stage'),ppm=zoom==='fit'?Math.max(.4,Math.min((st.clientWidth-70)/g.W,(st.clientHeight-70)/g.H)):zoom*96/25.4,cv=$('#sheet');
 cv.style.width=g.W*ppm+'px';cv.style.height=g.H*ppm+'px';ruler($('#rt'),g.W,ppm,false);ruler($('#rl'),g.H,ppm,true);
 $$('[data-act=zoom]').forEach(b=>b.classList.toggle('on',String(b.dataset.z)===String(zoom)));
}
window.addEventListener('resize',()=>{if(zoom==='fit')applyZoom()});

/* ---------- export ---------- */
const pagesList=()=>S.mode==='ink'?[...Array(inkPages()).keys()]:[0];
function ready(){
 if(S.mode==='tpl')return true;
 if(S.mode==='ink'&&!INK.length){toast('Add at least one image before exporting.');return false}
 if(S.mode==='photo'){if(!PH.length){toast('Add a photo before exporting.');return false}const g=photoGeom();if(!g.cols||!g.rows){toast('The photo does not fit on this paper. Reduce the margins or photo size.');return false}}
 return true}
function full(page){const c=mk(1,1);if(S.mode==='ink')drawInk(c,page,300);else if(S.mode==='tpl')drawTpl(c,300);else drawPhoto(c,300);return c}
const fname=ext=>`printlab-${S.mode==='ink'?'notes':'photos'}-${new Date().toISOString().slice(0,10)}.${ext}`;
async function exportPDF(){
 if(!ready())return;const J=window.jspdf&&window.jspdf.jsPDF;
 if(!J){toast('The PDF library did not load. Check your connection and reload the page.');return}
 toast('Rendering PDF…',60000);
 try{const{W,H}=dims(),o=W>H?'l':'p',pdf=new J({unit:'mm',format:[W,H],orientation:o,compress:true}),ps=pagesList();
  for(let i=0;i<ps.length;i++){await tick();const c=full(ps[i]);if(i)pdf.addPage([W,H],o);pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);c.width=c.height=1}
  pdf.save(fname('pdf'));toast('PDF downloaded.')}
 catch(e){toast('PDF export failed. Try fewer images or a smaller sheet.')}
}
async function exportPNG(){
 if(!ready())return;toast('Rendering PNG…',60000);await tick();
 try{full(S.mode==='ink'?pg:0).toBlob(b=>{if(!b){toast('PNG export failed. Try a smaller sheet.');return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname('png');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('PNG downloaded.')},'image/png')}
 catch(e){toast('PNG export failed. Try a smaller sheet.')}
}
async function printSheets(){
 if(!ready())return;toast('Preparing print…',60000);
 try{const{W,H}=dims(),area=$('#printArea');area.innerHTML='';const imgs=[];
  for(const p of pagesList()){await tick();const c=full(p),im=new Image();im.src=c.toDataURL('image/jpeg',.95);c.width=c.height=1;area.appendChild(im);imgs.push(im)}
  await Promise.all(imgs.map(i=>i.decode()));
  const st=document.createElement('style');st.id='pst';
  st.textContent=`@page{size:${W}mm ${H}mm;margin:0}@media print{html,body{height:auto!important;overflow:visible!important;background:#fff!important}body>*:not(#printArea){display:none!important}#printArea{display:block!important}#printArea img{display:block;width:${W}mm;height:${H}mm;page-break-after:always;break-after:page}#printArea img:last-child{page-break-after:auto;break-after:auto}}`;
  document.head.appendChild(st);$('#toast').style.display='none';
  const done=()=>{st.remove();area.innerHTML='';window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
  window.print()}
 catch(e){toast('Printing failed. Try downloading the PDF instead.')}
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
 const m=e.target.closest('[data-mode]');if(m){if(m.dataset.mode==='about'){view='about';$('#side').classList.add('open');sync();syncAbout();return}view='tool';S.mode=m.dataset.mode;pg=0;$('#side').classList.remove('open');ui();return}
 const at=e.target.closest('[data-atab]');if(at){aboutTab=at.dataset.atab;syncAbout();return}
 const as=e.target.closest('[data-astep]');if(as){aboutStep=aboutStep===+as.dataset.astep?null:+as.dataset.astep;syncAbout();return}
 const tk=e.target.closest('[data-tplkind]');if(tk){S.tpl.kind=tk.dataset.tplkind;syncTplOpts();render();return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 if(a==='del'&&e.target.closest('.qi')&&b.classList.contains('qi'))return;
 switch(a){
  case'add':$('#file').click();break;case'paste':pasteBtn();break;case'pdf':exportPDF();break;case'png':exportPNG();break;case'print':printSheets();break;
  case'reset':Object.assign(S.ink,{invert:false,hue:false,white:225,mono:'color',eco:false,scan:false,bri:0,con:0,sharp:0});sync();render();break;
  case'saveproj':saveProject();break;
  case'openproj':openProject(b.dataset.id);break;
  case'delproj':e.stopPropagation();deleteProject(b.dataset.id);break;
  case'up':mv(i,-1);break;case'down':mv(i,1);break;case'del':e.stopPropagation();del(i);break;
  case'sel':active=i;ui();break;case'menu':$('#side').classList.toggle('open');break;
  case'backtools':view='tool';ui();break;
  case'prevp':if(S.mode==='ink'&&pg>0){pg--;render()}break;case'nextp':if(S.mode==='ink'&&pg<inkPages()-1){pg++;render()}break;
  case'zoom':zoom=b.dataset.z==='fit'?'fit':+b.dataset.z;applyZoom();break;
 }
});
$('#main').addEventListener('click',()=>$('#side').classList.remove('open'));

/* ---------- about ---------- */
let aboutTab='story',aboutStep=0;
function syncAbout(){
 $$('#pAbout [data-atab]').forEach(b=>b.classList.toggle('on',b.dataset.atab===aboutTab));
 $('#ab-story').hidden=aboutTab!=='story';
 $('#ab-how').hidden=aboutTab!=='how';
 $('#ab-why').hidden=aboutTab!=='why';
 $$('#pAbout .abstep').forEach(s=>{const open=aboutStep===+s.dataset.astep;s.classList.toggle('open',open);s.querySelector('p').hidden=!open});
}

/* ---------- my projects (IndexedDB) ----------
   Photos are stored as images in IndexedDB, not localStorage — a photo
   as a data URL would blow the ~5 MB localStorage limit. Settings ride
   along in the same record. A full store never crashes the app: the
   save reports it plainly instead. */
const DBP=new Promise((res,rej)=>{
 const rq=indexedDB.open('printlab',1);
 rq.onupgradeneeded=()=>{rq.result.createObjectStore('projects',{keyPath:'id'})};
 rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
});
function idbTx(mode,fn){return DBP.then(db=>new Promise((res,rej)=>{const tx=db.transaction('projects',mode),st=tx.objectStore('projects'),rq=fn(st);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)}))}
const idbAll=()=>idbTx('readonly',st=>st.getAll());
const idbPut=rec=>idbTx('readwrite',st=>st.put(rec));
const idbDel=id=>idbTx('readwrite',st=>st.delete(id));
const idbGet=id=>idbTx('readonly',st=>st.get(id));
function imgFromURL(u){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=mk(im.naturalWidth,im.naturalHeight);c.getContext('2d').drawImage(im,0,0);res(c)};im.onerror=rej;im.src=u})}
async function saveProject(){
 const side=S.mode==='photo'?'photo':'ink';
 const inp=$('#pjName-'+side);let name=(inp?inp.value:'').trim();
 if(!name)name='Project '+new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
 try{
  const imgs=(S.mode==='photo'?PH:INK).map(it=>({name:it.name,dataUrl:it.src.toDataURL('image/png'),z:it.z||1,cx:it.cx??.5,cy:it.cy??.5,bri:it.bri||0}));
  const rec={id:Date.now(),name,mode:S.mode,savedAt:new Date().toISOString(),ink:JSON.parse(JSON.stringify(S.ink)),photo:JSON.parse(JSON.stringify(S.photo)),tpl:JSON.parse(JSON.stringify(S.tpl)),images:imgs};
  await idbPut(rec);toast('Project saved on this device.');renderProjects();
 }catch(e){
  if(e&&e.name==='QuotaExceededError')toast('Storage is full — delete an old project or remove some images, then try again.',6000);
  else toast('Could not save the project. Try removing some images first.',6000);
 }
}
async function openProject(id){
 try{
  const rec=await idbGet(+id);if(!rec){toast('That project is gone.');renderProjects();return}
  Object.assign(S.ink,rec.ink||{});Object.assign(S.photo,rec.photo||{});Object.assign(S.tpl,rec.tpl||{});
  S.mode=rec.mode==='photo'?'photo':rec.mode==='tpl'?'tpl':'ink';
  const list=[];
  for(const im of rec.images||[]){try{const c=await imgFromURL(im.dataUrl);list.push({id:++uid,src:c,name:im.name,thumb:thumb(c),z:im.z||1,cx:im.cx??.5,cy:im.cy??.5,bri:im.bri||0})}catch(e){}}
  if(S.mode==='photo'){PH=list;active=0;INK=[]}else{INK=list;PH=[]}
  pg=0;view='tool';ui();toast('Opened “'+rec.name+'”.');
 }catch(e){toast('Could not open that project. The saved data may be damaged.')}
}
async function deleteProject(id){
 try{await idbDel(+id);renderProjects();toast('Project deleted.')}catch(e){toast('Could not delete that project.')}
}
async function renderProjects(){
 let recs=[];try{recs=await idbAll()}catch(e){}
 recs.sort((a,b)=>b.id-a.id);
 const html=recs.length?recs.map(r=>`<div class="qi"><span>${esc(r.name)} <span style="color:var(--mu)">· ${esc((r.mode||'ink')==='photo'?'Photo':(r.mode||'ink')==='tpl'?'Template':'Ink-saver')} · ${(r.images||[]).length} image${(r.images||[]).length===1?'':'s'}</span></span><button class="btn sm" data-act="openproj" data-id="${r.id}">Open</button><button data-act="delproj" data-id="${r.id}" aria-label="Delete project">${ic('trash')}</button></div>`).join(''):'<p class="mu">No saved projects yet.</p>';
 ['ink','photo'].forEach(s=>{const el=$('#pjList-'+s);if(el)el.innerHTML=html});
}

/* ---------- PWA install ---------- */
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
function refreshInstall(){$$('.installBtn').forEach(b=>{b.hidden=isStandalone||(!deferredPrompt&&!isIOS)})}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;refreshInstall()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;refreshInstall();toast('PrintLab installed. Find it on your home screen.')});
async function installApp(){
 if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;refreshInstall();if(r&&r.outcome==='accepted')toast('Installing PrintLab…');return}
 if(isIOS){toast('To install: tap Share, then “Add to Home Screen”.',6000);return}
 toast('Install is not available in this browser. Try Chrome or Edge on Android, or Safari on iPhone.',6000);
}
document.addEventListener('click',e=>{if(e.target.closest('.installBtn'))installApp()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then((reg)=>{reg.update().catch(()=>{});var hadController=!!navigator.serviceWorker.controller,refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!refreshing){refreshing=true;location.reload()}})}).catch(()=>{})})}
refreshInstall();

build();initCrop();ui();syncTplOpts();renderProjects();
})();
